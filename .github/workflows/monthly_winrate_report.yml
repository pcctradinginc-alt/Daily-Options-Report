name: Monthly Win-Rate Report

on:
  schedule:
    # 1. des Monats, 09:00 UTC
    - cron: '0 9 1 * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (kein Email-Versand, nur HTML)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: monthly-winrate-report
  cancel-in-progress: false

jobs:
  winrate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: data-Ordner erstellen
        run: mkdir -p data

      # Liest den geteilten Cache, den der Daily-Job (gleiches Key-Präfix) gefüllt hat:
      # enthält trading_journal.sqlite + ml_outcome_model.joblib.
      - name: Journal + ML-Modell aus Cache laden
        uses: actions/cache/restore@v4
        with:
          path: data
          key: trading-journal-${{ runner.os }}-monthly-${{ github.run_id }}
          restore-keys: |
            trading-journal-${{ runner.os }}-

      - name: Dependencies installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monatsreport erstellen + versenden
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_TOKEN:     ${{ secrets.TRADIER_TOKEN }}
          TRADIER_SANDBOX:   "false"
          GMAIL_RECIPIENT:   ${{ secrets.GMAIL_RECIPIENT }}
          SMTP_SENDER:       ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/monthly_winrate_report.py --dry-run
          else
            python src/monthly_winrate_report.py
          fi

      - name: HTML-Vorschau als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-winrate-${{ github.run_number }}
          path: monthly_winrate_preview.html
          retention-days: 90
          if-no-files-found: ignore
